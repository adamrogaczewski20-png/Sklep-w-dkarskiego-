<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie | Sklep wędkarski</title>
</head>

<body>

    <main>
        <h1>Zaloguj się</h1>

        <form id="loginForm">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                required
            >

            <label for="password">Hasło</label>
            <input
                type="password"
                id="password"
                required
            >

            <button type="submit">
                Zaloguj się
            </button>

        </form>

        <p id="message"></p>
    </main>

    <script src="login.js"></script>

</body>
</html>
