<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produkty | Panel administratora</title>
</head>

<body>

    <main>

        <h1>Panel administratora</h1>

        <nav aria-label="Panel administratora">
            <a href="#">Produkty</a>
            <a href="#">Kategorie</a>
            <a href="#">Zamówienia</a>
        </nav>

        <hr>

        <section>

            <h2>Produkty</h2>

            <button
                type="button"
                id="addProductButton"
            >
                + Dodaj produkt
            </button>

        </section>


        <section
            id="productFormSection"
            hidden
        >

            <h2>Nowy produkt</h2>

            <form id="productForm">

                <label for="name">
                    Nazwa produktu
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >


                <label for="description">
                    Opis
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                ></textarea>


                <label for="sku">
                    SKU
                </label>

                <input
                    type="text"
                    id="sku"
                    name="sku"
                >


                <label for="price">
                    Cena
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    step="0.01"
                    required
                >


                <label for="category">
                    Kategoria
                </label>

                <select
                    id="category"
                    name="category_id"
                    required
                >
                    <option value="">
                        Wybierz kategorię
                    </option>
                </select>


                <label for="quantity">
                    Ilość w magazynie
                </label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="0"
                    step="1"
                    value="0"
                >


                <button type="submit">
                    Zapisz produkt
                </button>

                <button
                    type="button"
                    id="cancelButton"
                >
                    Anuluj
                </button>

            </form>

            <p id="message"></p>

        </section>


        <section>

            <h2>Lista produktów</h2>

            <div id="productsList">
                Ładowanie produktów...
            </div>

        </section>

    </main>


    <script src="products.js"></script>

</body>
</html>
