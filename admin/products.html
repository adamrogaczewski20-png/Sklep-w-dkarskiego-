<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkty | Panel administratora</title>
</head>

<body>

    <main>
        <h1>Produkty</h1>

        <nav aria-label="Kategorie">
            <a href="#">Przynęty</a>
            <a href="#">Gumy</a>
            <a href="#">Kopyta</a>
        </nav>

        <section>
            <h2>Nowy produkt</h2>

            <form id="productForm">

                <label for="name">Nazwa produktu</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="description">Opis</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                ></textarea>

                <label for="sku">SKU</label>
                <input
                    type="text"
                    id="sku"
                    name="sku"
                >

                <label for="price">Cena</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="category">Kategoria</label>
                <select id="category" name="category_id" required>
                    <option value="">Wybierz kategorię</option>
                </select>

                <button type="submit">
                    Dodaj produkt
                </button>

            </form>

            <p id="message"></p>
        </section>
    </main>

    <script src="products.js"></script>

</body>
</html>
