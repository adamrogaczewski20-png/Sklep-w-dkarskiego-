<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje konto | Sklep wędkarski</title>
</head>

<body>

    <main>
        <h1>Moje konto</h1>

        <section>
            <h2>Dane klienta</h2>

            <p>
                <strong>Imię:</strong>
                <span id="firstName">-</span>
            </p>

            <p>
                <strong>Nazwisko:</strong>
                <span id="lastName">-</span>
            </p>

            <p>
                <strong>E-mail:</strong>
                <span id="email">-</span>
            </p>
        </section>

        <button id="logoutButton">
            Wyloguj się
        </button>

        <p id="message"></p>
    </main>

    <script src="profile.js"></script>

</body>
</html>
